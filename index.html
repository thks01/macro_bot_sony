<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채권·매크로 시황</title>
<script>/* 테마: 기본 다크, 사용자가 고른 값은 이 브라우저에 기억 */
(function(){var t='dark';try{t=localStorage.getItem('mb_theme')||'dark';}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#15181d; --ink2:#4a5261; --ink3:#7b8494; --line:#e3e6eb;
  --accent:#2f5bd3; --accent-soft:#e8eefc; --up:#d0362c; --down:#2463c9; --chip:#eef0f3; --warn:#9a6b00;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#171a20; --ink:#e8eaee; --ink2:#b3b9c4; --ink3:#838b98; --line:#2a2f38;
  --accent:#7aa2ff; --accent-soft:#1e2a45; --up:#ff6b61; --down:#6aa3ff; --chip:#232830; --warn:#e0b04a;
  --shadow:none; color-scheme:dark;
}
.themebtn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:8px;padding:5px 10px;cursor:pointer}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink3)}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
select,input[type=search]{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=search]{width:180px}
main{max-width:1180px;margin:0 auto;padding:16px}
.empty{color:var(--ink3);text-align:center;padding:60px 0}
@media (max-width:640px){.top{position:static}.top-in{gap:8px}input[type=search]{flex:1;width:auto}}
.entry{scroll-margin-top:84px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin:0 0 14px}
.entry>details>summary{list-style:none;cursor:pointer;padding:14px 18px}
.entry>details>summary::-webkit-details-marker{display:none}
.head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.date{font-weight:700;font-variant-numeric:tabular-nums}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink2)}
.chip.evening{background:var(--accent-soft);color:var(--accent)}
.headline{font-weight:600;flex:1 1 320px}
.gen{font-size:12px;color:var(--ink3)}
.stats{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}
.body{padding:0 18px 16px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px}
@media (max-width:860px){.body{grid-template-columns:1fr}.headline{flex-basis:100%}}
h3{font-size:13px;color:var(--ink3);font-weight:600;margin:14px 0 6px;letter-spacing:.02em}
.comment p{margin:0 0 10px}
.cite{font-size:11px;vertical-align:super;padding:0 3px;border-radius:4px;background:var(--accent-soft);margin-left:1px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.tl li:first-child{border-top:0}
.tl .t{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
.news{margin:0;padding-left:0;list-style:none;font-size:13.5px}
.news li{padding:4px 0} .news .src{color:var(--ink3);font-size:12px;margin-left:4px}
.news .n{display:inline-block;min-width:20px;color:var(--accent);font-weight:600}
.outlook{margin-top:16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:4px 14px 8px}
.outlook h3{color:var(--accent);margin-top:10px}
.outlook .tag{font-weight:400;font-size:11.5px;color:var(--ink3);margin-left:6px}
.review{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:4px 14px 8px}
.review h3 .tag,.ol-t .tag{font-weight:400;font-size:11.5px;color:var(--ink3);margin-left:6px}
.rv{list-style:none;margin:4px 0;padding:0;font-size:13.5px;font-variant-numeric:tabular-nums}
.rv li{padding:3px 0;border-top:1px dashed var(--line)} .rv li:first-child{border-top:0}
.rv li.grp{list-style:none;margin-left:-14px;font-weight:600;color:var(--ink2)} .review p{margin:6px 0} .lesson{font-weight:600} .trk{font-size:12.5px;color:var(--ink3)}
.assess,.calls{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:4px 14px 10px}
.assess .tag,.calls .tag{font-weight:400;font-size:11.5px;color:var(--ink3);margin-left:6px}
.ag-t{font-weight:700;font-size:13px;margin:10px 0 4px;color:var(--accent)}
.at{width:100%;border-collapse:collapse;font-size:13.5px}
.at td{padding:6px 6px;border-top:1px solid var(--line);vertical-align:top}
.at tr:first-child td{border-top:0}
.at .an{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.at .av{white-space:nowrap;color:var(--ink2)} .at .as{white-space:nowrap;color:#d79b00;letter-spacing:-1px}
.at .as .dim{color:var(--line)} .at .ar{color:var(--ink)}
@media (max-width:640px){.at td{display:block;border-top:0;padding:2px 0}.at tr{display:block;border-top:1px solid var(--line);padding:6px 0}}
.why{font-size:12.5px;color:var(--ink3);margin:2px 0 0 10px}
.ol-item{margin:8px 0}.ol-t{font-weight:700;font-size:14px;margin-bottom:2px}.ol-item p{margin:0}
.k{font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px;background:var(--chip);color:var(--ink2)}
.k-리서치{background:var(--accent-soft);color:var(--accent)}
.note{font-size:12.5px;color:var(--ink3);margin:2px 0 4px 26px}
.summary{font-size:13.5px;line-height:1.75;color:var(--ink2);background:var(--bg);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.summary b{color:var(--ink)}
.nocomment{color:var(--ink3);font-size:14px;margin:6px 0}
.sub{grid-column:1/-1}
.sub>summary{cursor:pointer;font-size:13.5px;color:var(--ink2);padding:6px 0;border-top:1px solid var(--line)}
.charts .album{font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:340px;overflow:hidden}
.loading{color:var(--ink3);font-size:13px;padding:10px 0}
.warn li{font-size:12.5px;color:var(--warn)}
a.num{color:inherit;text-decoration:underline dotted var(--accent);text-underline-offset:3px;cursor:pointer}
a.num:hover{background:var(--accent-soft);text-decoration:none}
.bld .row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.bld input{flex:1 1 320px;font:inherit;font-size:13.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.bld button,.bld select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.bld button.go,.bld button.nlgo{background:var(--accent);border-color:var(--accent);color:#fff}
.bld .quick button{font-size:12.5px;padding:4px 9px;background:var(--chip)}
.bld .msg{font-size:12.5px;color:var(--ink3);min-height:18px}
.bld .msg.err{color:var(--up)}
.bchart{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:0}
.bchart.on{min-height:420px}
.catlist{font-size:12px;color:var(--ink2);columns:3 220px;padding:6px 0}
.catlist code{color:var(--accent);cursor:pointer}

#mb-login{max-width:380px;margin:12vh auto;padding:28px 24px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#mb-login h2{margin:0 0 6px;font-size:18px} #mb-login p{margin:0 0 16px;color:var(--ink3);font-size:13px}
#mb-login input[type=password],#mb-login input[type=text]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px}
#mb-login button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
#mb-login label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);margin:2px 0 12px}
#mb-login .err{color:var(--up);font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand">채권·매크로 시황<small>업데이트 2026-10-17 06:07 · 26건</small></div>
  <div class="seg" role="group" aria-label="회차">
    <button class="on" data-f="all">전체</button><button data-f="evening">국내 17시</button><button data-f="overnight">오버나잇 06시</button>
  </div>
  <select id="date" aria-label="날짜"><option value="">전체 날짜</option><option>2026-10-17</option><option>2026-10-16</option><option>2026-10-15</option><option>2026-10-14</option><option>2026-10-13</option><option>2026-10-12</option><option>2026-10-10</option><option>2026-10-09</option><option>2026-10-08</option><option>2026-10-07</option><option>2026-10-06</option><option>2026-10-03</option><option>2026-10-02</option><option>2026-10-01</option><option>2026-09-30</option><option>2026-09-29</option></select>
  <input type="search" id="q" placeholder="검색 (예: 바이백, CPI)">
  <button class="themebtn" id="themebtn" type="button" title="화면 테마 바꾸기">🌙 다크</button>
</div></div>
<main id="mb-main"><div id="mb-login"><h2>🔒 채권·매크로 시황</h2><p>비밀번호: 10/15 국고 10년 민평 (소수 셋째 자리까지) + PIN</p><form id="mb-form"><input id="mb-rate" type="password" inputmode="decimal" autocomplete="current-password" placeholder="국고 10년 민평 (예: x.xxx)" autofocus><input id="mb-pin" type="password" inputmode="numeric" placeholder="PIN"><label><input id="mb-remember" type="checkbox"> 이 기기에서 기억 (다음 비밀번호 변경 전까지)</label><button type="submit">열기</button><div id="mb-err" class="err"></div></form></div></main>
<script>
(function(){
  var C={"salt": "Y+r+VEoU0HtvRZjcyrhRzg==", "iter": 600000, "pin": true, "ver": "20261017060756"};
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function norm(r){var x=parseFloat(String(r).replace(/[^\d.\-]/g,''));return isNaN(x)?'':x.toFixed(3);}
  var KEY=null;
  function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(C.salt),iterations:C.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);});}
  function dec(txt){var u=b64(txt.trim());return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12)).then(function(b){return new TextDecoder().decode(b);});}
  function get(path){return fetch(path+'?v='+C.ver,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(path+' '+r.status);return r.text();});}
  var E=window.MB_ENC={
    load:function(src){return get(src+'.enc').then(dec).then(function(code){(new Function(code))();});}
  };
  function chartFn(cfg){
    return function(q,pack){
      if(!(q||'').trim()) return Promise.resolve({error:'요청을 입력하세요.'});
      var lines=pack.catalog.map(function(c){return [c.id,c.name,c.unit||'',c.freq].join('\t');}).join('\n');
      var tb=pack.tables||{}, tl=Object.keys(tb).map(function(t){var x=tb[t];
        return [t,x.name,x.unit||'','열: '+x.cols.join('|'),'행: '+x.rows.slice(0,12).map(function(r){return r[0];}).join(', ')].join('\t');}).join('\n');
      var gc={temperature:0.2,maxOutputTokens:2048,responseMimeType:'application/json'};
      if(/2\.5-flash/.test(cfg.model)) gc.thinkingConfig={thinkingBudget:0};
      var text='시계열 카탈로그 (id\t이름\t단위\tfreq):\n'+lines+'\n\n단면 표 (id\t이름\t단위\t열\t행 예시):\n'+tl+'\n\n요청: '+q.trim().slice(0,300);
      var body={systemInstruction:{parts:[{text:cfg.system}]},contents:[{role:'user',parts:[{text:text}]}],generationConfig:gc};
      return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+cfg.model+':generateContent',
        {method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},body:JSON.stringify(body)})
      .then(function(r){return r.json();}).then(function(r){
        if(r.error) throw new Error('Gemini '+(r.error.code||'')+' '+(r.error.message||''));
        var t=((((r.candidates||[])[0]||{}).content||{}).parts||[]).map(function(p){return p.text||'';}).join('');
        var m=t.match(/\{[\s\S]*\}/); if(!m) return {error:'해석 실패'};
        return JSON.parse(m[0]);                       // 검증은 대시보드 normSpec (서버 모드와 공통)
      });
    };
  }
  function unlock(pw,remember){
    var msg=document.getElementById('mb-err'); msg.textContent='확인 중…';
    return derive(pw).then(function(k){KEY=k;return get('content.enc');}).then(dec).then(function(html){
      try{(remember?localStorage:sessionStorage).setItem('mb_pw',pw);}catch(e){}
      document.getElementById('mb-login').remove();
      document.getElementById('mb-main').innerHTML=html;
      return get('cfg.enc').then(dec).then(function(t){var c=JSON.parse(t); if(c.key) E.chart=chartFn(c);}).catch(function(){})
        .then(function(){window.mbInit();});
    }).catch(function(e){KEY=null;msg.textContent=(e&&e.name==='OperationError')?'비밀번호가 맞지 않습니다.':('열기 실패: '+((e&&e.message)||e));throw e;});
  }
  document.addEventListener('DOMContentLoaded',function(){
    if(!window.crypto||!crypto.subtle){document.getElementById('mb-err').textContent='이 브라우저는 암호 해제를 지원하지 않습니다 (https 주소로 여세요).';return;}
    var f=document.getElementById('mb-form');
    f.addEventListener('submit',function(ev){ev.preventDefault();
      var r=norm(document.getElementById('mb-rate').value); if(!r){document.getElementById('mb-err').textContent='숫자로 입력하세요 (예 4.415)';return;}
      var pinEl=document.getElementById('mb-pin'), pw=r+(C.pin?'|'+(pinEl?pinEl.value.trim():''):'');
      unlock(pw,document.getElementById('mb-remember').checked).catch(function(){});
    });
    var saved=null; try{saved=sessionStorage.getItem('mb_pw')||localStorage.getItem('mb_pw');}catch(e){}
    if(saved) unlock(saved,false).catch(function(){document.getElementById('mb-err').textContent='';});
  });
})();
</script>
<script>
window.mbInit=function(){
  var filt='all', day='', q='';
  var arts=[].slice.call(document.querySelectorAll('.entry'));
  function apply(){
    arts.forEach(function(a){
      var ok=(filt==='all'||a.dataset.edition===filt)&&(!day||a.dataset.date===day)&&(!q||a.textContent.toLowerCase().indexOf(q)>=0);
      a.style.display=ok?'':'none';
    });
  }
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click',function(){document.querySelectorAll('.seg button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');filt=b.dataset.f;apply();});
  });
  document.getElementById('date').addEventListener('change',function(e){day=e.target.value;apply();});
  document.getElementById('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();apply();});

  // 링크의 #날짜-회차 로 들어오면 그 시황을 펼치고 이동
  function openHash(){
    var id=decodeURIComponent(location.hash.slice(1)); if(!id) return;
    var el=document.getElementById(id.replace(/-s\d+$/,'')); if(!el) return;
    el.querySelector('details').open=true; setTimeout(function(){document.getElementById(id).scrollIntoView({block:'start'});},30);
  }
  window.addEventListener('hashchange',openHash); openHash();

  // ---------- 테마 (차트 색도 함께) ----------
  var THEMES={dark:{bg:'#171a20',ink:'#e8eaee',ink2:'#b3b9c4',grid:'#2a2f38',zero:'#4a5160',hover:'#232830'},
              light:{bg:'#ffffff',ink:'#15181d',ink2:'#4a5261',grid:'#e9ecef',zero:'#cfcec9',hover:'#ffffff'}};
  var LIGHT_INK=['#0b0b0b','#52514e','#8a8984','#15181d','#4a5261','#111','#111111','#666','#888','#999'];
  function curTheme(){return document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';}
  function themeLay(lay){
    var T=THEMES[curTheme()]; lay=lay||{};
    lay.paper_bgcolor=T.bg; lay.plot_bgcolor=T.bg;
    lay.font=Object.assign({},lay.font||{},{color:T.ink});
    if(lay.title&&typeof lay.title==='object') lay.title.font=Object.assign({},lay.title.font||{},{color:T.ink});
    lay.legend=Object.assign({},lay.legend||{},{font:Object.assign({},(lay.legend||{}).font||{},{color:T.ink2}),bgcolor:'rgba(0,0,0,0)'});
    lay.hoverlabel=Object.assign({},lay.hoverlabel||{},{bgcolor:T.hover,font:Object.assign({},(lay.hoverlabel||{}).font||{},{color:T.ink})});
    Object.keys(lay).forEach(function(k){ if(/^[xy]axis\d*$/.test(k)){ var a=lay[k]=Object.assign({},lay[k]);
      a.gridcolor=T.grid; a.linecolor=T.grid; a.tickcolor=T.grid; a.zerolinecolor=T.zero;
      a.tickfont=Object.assign({},a.tickfont||{},{color:T.ink2});
      if(a.title&&typeof a.title==='object') a.title.font=Object.assign({},a.title.font||{},{color:T.ink2}); }});
    ['xaxis','yaxis'].forEach(function(k){ if(!lay[k]) lay[k]={gridcolor:T.grid,linecolor:T.grid,zerolinecolor:T.zero,tickfont:{color:T.ink2}}; });
    (lay.annotations||[]).forEach(function(an){ var c=(an.font||{}).color;
      if(!c||LIGHT_INK.indexOf(String(c).toLowerCase())>=0||c===THEMES.dark.ink||c===THEMES.light.ink||c===THEMES.dark.ink2||c===THEMES.light.ink2)
        an.font=Object.assign({},an.font||{},{color:T.ink2});
      if(an.bgcolor&&/255,\s*255,\s*255/.test(an.bgcolor)) an.bgcolor=curTheme()==='dark'?'rgba(23,26,32,0.85)':an.bgcolor; });
    return lay;
  }
  function themeData(data){                      // 표(Table) 트레이스: 머리·칸 배경과 글자색
    var T=THEMES[curTheme()], dk=curTheme()==='dark';
    (data||[]).forEach(function(t){
      if(t.type==='table'){
        t.header=Object.assign({},t.header||{}); t.cells=Object.assign({},t.cells||{});
        t.header.fill={color:dk?'#232a36':'#eef3fa'}; t.cells.fill={color:dk?'#171a20':'#ffffff'};
        t.header.font=Object.assign({},t.header.font||{},{color:T.ink}); t.cells.font=Object.assign({},t.cells.font||{},{color:T.ink});
        t.header.line={color:T.grid}; t.cells.line={color:T.grid};
      } else if(t.type==='heatmap'&&t.texttemplate){ t.textfont=Object.assign({},t.textfont||{},{color:dk?'#e8eaee':'#15181d'}); }
    });
    return data;
  }
  function restyleAll(){
    if(!window.Plotly) return;
    document.querySelectorAll('.js-plotly-plot').forEach(function(div){
      try{ Plotly.react(div, themeData(JSON.parse(JSON.stringify(div.data||[]))), themeLay(JSON.parse(JSON.stringify(div.layout||{})))); }catch(e){} });

  var tb=document.getElementById('themebtn');

  function tableChart(pack,sp){
    var T=(pack.tables||{})[sp.table]; if(!T) throw new Error('없는 표: '+sp.table+' (사용 가능한 시계열·표 보기 참고)');
    var ci=(sp.cols&&sp.cols.length)?sp.cols.map(function(c){var i=T.cols.indexOf(c);return i;}).filter(function(i){return i>=0;}):T.cols.map(function(_,i){return i;});
    if(!ci.length) ci=T.cols.map(function(_,i){return i;});
    var rows=T.rows, labels=rows.map(function(r){return r[0];}), h=sp.hbar||rows.length>9||labels.some(function(l){return l.length>10;});
    var traces=ci.map(function(i,j){var ys=rows.map(function(r){return r[i+1];});
      var one=ci.length===1, signed=ys.some(function(v){return v!=null&&v<0;});
      return {type:'bar',name:T.cols[i],x:h?ys:labels,y:h?labels:ys,orientation:h?'h':'v',
        marker:{color:one&&signed?ys.map(function(v){return v>=0?UPC:DNC;}):COL[j%10]},
        text:one?ys.map(function(v){return v==null?'':(Math.abs(v)>=100?v.toFixed(0):v.toFixed(2));}):null,textposition:'outside',cliponaxis:false,
        hovertemplate:'%{'+(h?'y':'x')+'} · '+T.cols[i]+': %{'+(h?'x':'y')+':.2f}<extra></extra>'};});
    // 열마다 크기 차이가 크면(예: 레벨 bp 와 z60) 열별 패널로 나눠 그림
    var rng=ci.map(function(i){var a=rows.map(function(r){return Math.abs(r[i+1]||0);});return Math.max.apply(null,a)||1;});
    var facet=ci.length>1&&Math.max.apply(null,rng)/Math.min.apply(null,rng)>6;
    var lay=baseLay({barmode:'group',showlegend:ci.length>1&&!facet,title:{text:T.name,font:{size:13}},
      height:h?Math.max(380,90+(facet?22:26*Math.max(1,ci.length*0.6))*rows.length):(facet?Math.max(420,230*ci.length):420)});
    var cax={type:'category',automargin:true};
    if(!facet){
      var vax={title:T.unit||'',zeroline:true,zerolinecolor:'#999'};
      if(h){lay.xaxis=vax;lay.yaxis=Object.assign(cax,{autorange:'reversed'});} else {lay.yaxis=vax;lay.xaxis=cax;}
      return {traces:traces,layout:lay};
    }
    var n=ci.length, gap=0.04, w=(1-gap*(n-1))/n;
    traces.forEach(function(t,j){var ys=h?t.x:t.y; t.marker={color:ys.map(function(v){return v>=0?UPC:DNC;})};
      t.text=ys.map(function(v){return v==null?'':(Math.abs(v)>=100?v.toFixed(0):v.toFixed(2));});
      var ax=j?String(j+1):''; if(h){t.xaxis='x'+ax;} else {t.yaxis='y'+ax;}
      var dom=[j*(w+gap),j*(w+gap)+w], vx={title:T.cols[ci[j]],zeroline:true,zerolinecolor:'#999',anchor:h?'y':'x'};
      if(h){vx.domain=dom; lay['xaxis'+ax]=vx;} else {vx.domain=[1-dom[1],1-dom[0]]; lay['yaxis'+ax]=vx;}});
    if(h) lay.yaxis=Object.assign(cax,{autorange:'reversed'}); else lay.xaxis=cax;
    lay.annotations=ci.map(function(i,j){var d0=j*(w+gap);return h?{xref:'paper',yref:'paper',x:d0+w/2,y:1.0,yanchor:'bottom',showarrow:false,text:'<b>'+T.cols[i]+'</b>',font:{size:12}}:
      {xref:'paper',yref:'paper',x:0,y:1-d0,xanchor:'left',yanchor:'bottom',showarrow:false,text:'<b>'+T.cols[i]+'</b>',font:{size:12}};});
    lay.margin.t=64;
    return {traces:traces,layout:lay};
  }
  function renderSpec(pack,sp){
    if(sp.type==='table') return tableChart(pack,sp);
    if(!sp.exprs||!sp.exprs.length) throw new Error('식이 비어 있습니다');
    if(sp.type==='bar'||sp.type==='hbar') return barChart(pack,sp);
    if(sp.type==='curve') return curveChart(pack,sp);
    if(sp.type==='scatter') return scatterChart(pack,sp);
    if(sp.type==='hist') return histChart(pack,sp);
    if(sp.type==='heatmap') return heatChart(pack,sp);
    return seriesChart(pack,sp);
  }
  function specFromBox(box){
    var ex=box.querySelector('.ex').value.trim(), ty=box.querySelector('.ty').value, sp={type:ty,days:+box.querySelector('.rg').value,
      agg:box.querySelector('.ag').value,compare:(box.dataset.compare||'').split(',').filter(Boolean).map(Number)};
    var m=/^(T_[A-Za-z0-9_]+)(?::(.+))?$/.exec(ex);
    if(m){sp.type='table';sp.table=m[1];sp.cols=m[2]?m[2].split('|').map(function(x){return x.trim();}):[];}
    else { if(ty==='table') sp.type='bar'; sp.exprs=parseExprs(ex); }
    return sp;
  }
  function draw(box,key,sp){
    var msg=box.querySelector('.msg'), ch=box.querySelector('.bchart');
    msg.className='msg'; msg.textContent='그리는 중…';
    Promise.all([ensurePlotly(),loadData(key)]).then(function(r){
      var b=renderSpec(r[1],sp);
      if(sp.title) b.layout.title={text:sp.title+(b.layout.title&&b.layout.title.text?' — '+b.layout.title.text:''),font:{size:14}};
      ch.classList.add('on'); Plotly.newPlot(ch,b.traces,themeLay(b.layout),{responsive:true,displaylogo:false});
      msg.textContent=sp.note||'';
    }).catch(function(e){msg.className='msg err'; msg.textContent=(e&&e.message)||String(e);});
  }
  function setBox(box,sp){                         // 스펙 → 입력칸 (사용자가 이어서 고칠 수 있게)
    box.querySelector('.ex').value=sp.type==='table'?sp.table+(sp.cols&&sp.cols.length?':'+sp.cols.join('|'):''):
      sp.exprs.map(function(x){return x.label+'='+x.expr;}).join(', ');
    box.querySelector('.ty').value=sp.type; if(sp.agg) box.querySelector('.ag').value=sp.agg;
    if(sp.days!=null) box.querySelector('.rg').value=String(sp.days);
    box.dataset.compare=(sp.compare||[]).join(',');
  }
  var TYPES=['line','area','bar_ts','bar','hbar','curve','scatter','hist','heatmap','table'], AGGS=['last','chg','pct','mean','max','min','z'];
  function normSpec(j,pack){                       // LLM 응답 검증 (서버·배포본 공통)
    if(!j||j.error) throw new Error((j&&j.error)||'해석 실패');
    var ids={};pack.catalog.forEach(function(c){ids[c.id]=c;});
    var sp={title:String(j.title||'').slice(0,60),type:TYPES.indexOf(j.type)>=0?j.type:'line',
      days:[0,30,91,182,365,1096,1826,3653].indexOf(j.days)>=0?j.days:91,agg:AGGS.indexOf(j.agg)>=0?j.agg:(j.type==='bar'||j.type==='hbar'?'chg':'last'),
      compare:(j.compare||[]).map(Number).filter(function(x){return isFinite(x)&&x>=0&&x<=3700;}).slice(0,5),note:String(j.note||'')};
    if(sp.type==='table'||j.table){
      if(!(pack.tables||{})[j.table]) throw new Error('없는 표: '+j.table+(sp.note?' — '+sp.note:''));
      sp.type='table'; sp.table=j.table; sp.cols=(j.cols||[]).filter(function(c){return pack.tables[j.table].cols.indexOf(c)>=0;});
      if(j.type==='hbar') sp.hbar=true; return sp;}
    var out=[],bad=[];
    (j.exprs||[]).forEach(function(x){
      var e=String(x.expr||'').trim(), toks=(e.match(/[A-Za-z_][A-Za-z0-9_]*/g)||[]).filter(function(t){return !/^(chg|pct|lag|ma|z|sum)\d+[dwmy]?$/i.test(t);});
      var ok=e&&/^[A-Za-z0-9_+\-*\/(). ]+$/.test(e)&&toks.length&&toks.every(function(t){return ids[t];});
      if(ok){var f={};toks.forEach(function(t){f[ids[t].freq]=1;});ok=Object.keys(f).length===1;}
      if(ok) out.push({label:String(x.label||e).replace(/[,=]/g,' ').slice(0,30),expr:e}); else bad.push(e);});
    if(out.length){var f0=null;out=out.filter(function(x){var t=(x.expr.match(/[A-Za-z_][A-Za-z0-9_]*/g)||[]).filter(function(t){return ids[t];})[0];
      var f=ids[t].freq; if(f0===null) f0=f; return f===f0;});}
    if(bad.length) sp.note+=(sp.note?' ':'')+'(사용할 수 없는 식 제외: '+bad.join(', ').slice(0,120)+')';
    if(!out.length) throw new Error(sp.note||'그릴 수 있는 시계열을 찾지 못했습니다.');
    sp.exprs=out; return sp;
  }
  document.querySelectorAll('details.builder').forEach(function(d){
    var key=d.dataset.key, box=d.querySelector('.bld'), ex=box.querySelector('.ex');
    function go(){draw(box,key,specFromBox(box));}
    box.querySelector('.go').addEventListener('click',go);
    ex.addEventListener('keydown',function(e){if(e.key==='Enter'){box.dataset.compare='';go();}});
    box.querySelectorAll('.quick button').forEach(function(b){b.addEventListener('click',function(){
      ex.value=b.dataset.x; box.querySelector('.ty').value=b.dataset.t||'line'; box.dataset.compare=b.dataset.c||'';
      if(b.dataset.r) box.querySelector('.rg').value=b.dataset.r; go();});});
    d.addEventListener('toggle',function(){
      if(!d.open||d.dataset.cat) return; d.dataset.cat='1';
      loadData(key).then(function(pack){
        var tb=pack.tables||{};
        box.querySelector('.catlist').innerHTML=Object.keys(tb).map(function(t){
          return '<div><code data-id="'+t+'">'+t+'</code> [표] '+tb[t].name+' — '+tb[t].cols.join('·')+'</div>';}).join('')+
          pack.catalog.map(function(c){
          return '<div><code data-id="'+c.id+'">'+c.id+'</code> '+c.name+(c.unit?' ('+c.unit+')':'')+(c.freq==='1m'?' · 장중':'')+'</div>';}).join('');
        box.querySelectorAll('.catlist code').forEach(function(cd){cd.addEventListener('click',function(){
          var id=cd.dataset.id; if(/^T_/.test(id)){ex.value=id;box.querySelector('.ty').value='table';} else ex.value=(ex.value&&!/^T_/.test(ex.value)?ex.value+', ':'')+id;});});
      }).catch(function(){box.querySelector('.catlist').textContent='시계열 묶음이 없습니다 (이 회차는 예전 형식).';});
    });
    var nl=box.querySelector('.nl'), nlgo=box.querySelector('.nlgo');
    function apply(j,pack){var sp=normSpec(j,pack); setBox(box,sp); draw(box,key,sp);}
    function ask(){
      var msg=box.querySelector('.msg');
      if(window.MB_ENC){                                  // 배포본: 브라우저에서 바로 Gemini 호출 (키는 암호화된 설정 안)
        if(!window.MB_ENC.chart){msg.className='msg err';msg.textContent='배포본에는 자연어 차트 키가 설정되지 않았습니다. 식 입력·빠른 선택을 쓰세요.';return;}
        msg.className='msg'; msg.textContent='요청 해석 중…';
        loadData(key).then(function(pack){return window.MB_ENC.chart(nl.value,pack).then(function(j){apply(j,pack);});})
          .catch(function(e){msg.className='msg err';msg.textContent='요청 실패: '+((e&&e.message)||e);});
        return;
      }
      if(location.protocol.indexOf('http')!==0){msg.className='msg err';msg.textContent='자연어 요청은 서버 모드에서만 됩니다: python run.py serve 실행 후 http://127.0.0.1:8765 로 열기. (식 입력·빠른 선택은 지금도 됩니다)';return;}
      msg.className='msg'; msg.textContent='요청 해석 중…';
      Promise.all([loadData(key),fetch('api/chart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:nl.value,key:key})}).then(function(r){return r.json();})])
        .then(function(r){apply(r[1],r[0]);})
        .catch(function(e){msg.className='msg err';msg.textContent='요청 실패: '+((e&&e.message)||e);});
    }
    nlgo.addEventListener('click',ask); nl.addEventListener('keydown',function(e){if(e.key==='Enter')ask();});
  });
  document.addEventListener('click',function(ev){
    var a=ev.target.closest('a.num'); if(!a) return; ev.preventDefault();
    var art=a.closest('.entry'), d=openBuilder(art); if(!d) return;
    var box=d.querySelector('.bld'), ex=box.querySelector('.ex'), rg=box.querySelector('.rg');
    ex.value=a.textContent.trim().replace(/[,=]/g,'')+'='+a.dataset.x;
    box.querySelector('.ty').value='line'; box.dataset.compare='';
    draw(box,art.id,specFromBox(box));
    setTimeout(function(){d.scrollIntoView({block:'start',behavior:'smooth'});},50);
  });

  document.querySelectorAll('details.charts').forEach(function(d){
    d.addEventListener('toggle',function(){
      if(!d.open||d.dataset.loaded) return; d.dataset.loaded='1';
      var key=d.dataset.key, box=d.querySelector('.chart-wrap');
      ensurePlotly().then(function(){
        return new Promise(function(ok,no){pending[key]=ok;mbLoad('entries/'+key+'.js').catch(no);});
      }).then(function(list){render(box,list);}).catch(function(src){box.querySelector('.loading').textContent='차트를 불러오지 못했습니다: '+src;});
    });
  });
};
if(!window.MB_ENC) window.mbInit();
</script>
