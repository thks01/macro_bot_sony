<script>
(function(){
  var C={"salt": "eUux/2c92anbKpDJt4m3UQ==", "iter": 600000, "pin": true, "ver": "20261114071913"};
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function norm(r){var x=parseFloat(String(r).replace(/[^\d.\-]/g,''));return isNaN(x)?'':x.toFixed(3);}
  var KEY=null;
  function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(C.salt),iterations:C.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);});}
  function dec(txt){var u=b64(txt.trim());return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12)).then(function(b){return new TextDecoder().decode(b);});}
  function get(path){return fetch(path+'?v='+C.ver,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(path+' '+r.status);return r.text();});}
  var E=window.MB_ENC={
    load:function(src){return getA(src).then(gunzip).then(function(code){(new Function(code))();});},
    blob:function(src,type){return getA(src).then(function(b){return new Blob([b],{type:type||'application/octet-stream'});});}
  };
  // 보관 키로 암호화된 이진 파일(.aenc): 내용이 같으면 URL·바이트가 같아 브라우저 캐시 재검증(304)으로 재사용
  var AKEY=null;
  function getA(src){
    return fetch(src+'.aenc',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(src+' '+r.status);return r.arrayBuffer();})
      .then(function(buf){var u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},AKEY,u.slice(12));});
  }
  function gunzip(buf){
    if(!window.DecompressionStream) throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다 (최신 크롬·사파리로 여세요)');
    return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  function chartFn(cfg){
    var GEM_OK={};                                    // 모델별로 통한 generationConfig
    return function(q,pack,status,SYS){                 // SYS 를 주면 그 지시문(백테스트 등)으로, 단면 표 없이 일별 시계열만
      if(!(q||'').trim()) return Promise.resolve({error:'요청을 입력하세요.'});
      var SYSTEM=SYS||cfg.system;
      if(!pack){ var text0=q.trim().slice(0,1500); }      // 시나리오 등: 카탈로그 없이 요청(시장 상황 포함)만
      var lines=pack?pack.catalog.filter(function(c){return !SYS||c.freq==='D';}).map(function(c){return [c.id,c.name,c.unit||'',c.freq].join('\t');}).join('\n'):'';
      var tb=(pack&&pack.tables)||{}, tl=Object.keys(tb).map(function(t){var x=tb[t];
        return [t,x.name,x.unit||'','열: '+x.cols.join('|'),'행: '+x.rows.slice(0,12).map(function(r){return r[0];}).join(', ')].join('\t');}).join('\n');
      var text=!pack?text0:'시계열 카탈로그 (id\t이름\t단위\tfreq):\n'+lines+(SYS?'':'\n\n단면 표 (id\t이름\t단위\t열\t행 예시):\n'+tl)+'\n\n요청: '+q.trim().slice(0,400);
      function parse(t){var m=(t||'').match(/\{[\s\S]*\}/); if(!m) return {error:'해석 실패'};
        return JSON.parse(m[0]);}                      // 검증은 대시보드 normSpec (서버 모드와 공통)
      // 시간 제한 있는 POST (과부하 때 한참 붙잡고 있다가 503 을 주는 경우 대비). 기본 90초 = publish.llm_timeout_sec
      //  (Gemini 3.x 는 생각을 최소(low)로 해도 카탈로그 ~700개 해석에 25초를 넘기는 경우가 있음)
      var TMO=(cfg.timeout_sec||90)*1000;
      function post(url,headers,body){
        var ac=window.AbortController?new AbortController():null, to=setTimeout(function(){if(ac)ac.abort();},TMO);
        return fetch(url,{method:'POST',headers:headers,body:JSON.stringify(body),signal:ac?ac.signal:undefined})
          .then(function(r){return r.json().catch(function(){return {error:{code:r.status,message:'HTTP '+r.status}};});})
          .catch(function(e){return {error:{code:'timeout',message:(e&&e.name==='AbortError')?'응답 지연('+Math.round(TMO/1000)+'초)':String(e&&e.message||e)}};})
          .then(function(j){clearTimeout(to);return j;});
      }
      function claude(a){
        var cb={model:a.model,max_tokens:16000,system:SYSTEM,messages:[{role:'user',content:text}],output_config:{effort:'low'}};
        var h={'content-type':'application/json','x-api-key':a.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
        var U='https://api.anthropic.com/v1/messages';
        return post(U,h,cb).then(function(r){
          if(r.error&&/effort|output_config/i.test(r.error.message||'')){delete cb.output_config;return post(U,h,cb);}   // 구형 모델
          return r;
        }).then(function(r){
          if(r.error) throw new Error('Claude '+(r.error.type||r.error.code||'')+' '+(r.error.message||''));
          return parse((r.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text||'';}).join(''));
        });
      }
      function gemini(a){
        // 차트 스펙은 추론 없이 바로 출력.
        //  2.5: thinkingBudget 0 / 3.x 이후: thinkingLevel minimal → (거부 시) low → 설정 없음
        //  3.x 이후는 temperature·top_p·top_k 를 보내지 않음 (3.8 등은 폐지 — 보내면 400 이거나 루프·품질 저하)
        //  400 메시지에 따라 문제 파라미터만 빼고 다시 보냄. 통한 설정은 모델별로 기억 (같은 세션 재요청 시 바로)
        var v25=/2\.5/.test(a.model);
        var gc=GEM_OK[a.model]?JSON.parse(GEM_OK[a.model]):(v25?
          {temperature:0.2,maxOutputTokens:8192,responseMimeType:'application/json',thinkingConfig:{thinkingBudget:0}}:
          {maxOutputTokens:8192,responseMimeType:'application/json',thinkingConfig:{thinkingLevel:'minimal'}});
        var body={systemInstruction:{parts:[{text:SYSTEM}]},contents:[{role:'user',parts:[{text:text}]}],generationConfig:gc};
        var U='https://generativelanguage.googleapis.com/v1beta/models/'+a.model+':generateContent', H={'Content-Type':'application/json','x-goog-api-key':a.key};
        function fix(r){                                   // 400 → 고칠 수 있는 파라미터면 고치고 true
          if(!(r.error&&(r.error.code===400||r.error.status==='INVALID_ARGUMENT'))) return false;
          var m=String(r.error.message||''), ch=false;
          if(/thinking/i.test(m)&&gc.thinkingConfig){
            if(gc.thinkingConfig.thinkingLevel==='minimal') gc.thinkingConfig={thinkingLevel:'low'};
            else delete gc.thinkingConfig;
            ch=true;}
          if(/temperature|top_?p|top_?k|sampling/i.test(m)){['temperature','topP','topK'].forEach(function(k){if(k in gc){delete gc[k];ch=true;}});}
          if(/response_?mime|mime_?type|json/i.test(m)&&gc.responseMimeType){delete gc.responseMimeType;ch=true;}
          if(ch&&window.console) console.warn('[자연어 차트] Gemini 400 → 설정 조정 후 재요청:',m,JSON.stringify(gc));
          return ch;
        }
        function go(n){return post(U,H,body).then(function(r){return (n<4&&fix(r))?go(n+1):r;});}
        return go(0).then(function(r){
          if(r.error) throw new Error('Gemini('+a.model+') '+(r.error.code||'')+' '+(r.error.status||'')+' '+(r.error.message||''));
          var c0=(r.candidates||[])[0]||{};
          if(window.console) console.log('[자연어 차트]',a.model,c0.finishReason,JSON.stringify(gc),r.usageMetadata);
          var tx=((c0.content||{}).parts||[]).filter(function(p){return !p.thought;}).map(function(p){return p.text||'';}).join('');
          if(!tx.trim()) throw new Error('Gemini('+a.model+') 빈 응답 ('+(c0.finishReason||(r.promptFeedback||{}).blockReason||'?')+')');
          GEM_OK[a.model]=JSON.stringify(gc);
          return parse(tx);
        });
      }
      // 시도 순서: 기본 모델 → (과부하·한도·지연이면) 같은 모델 1회 재시도 → 대체 모델 → 다른 공급자
      var chain=(cfg.chain&&cfg.chain.length)?cfg.chain:[{provider:cfg.provider,key:cfg.key,model:cfg.model}];
      var tries=[]; chain.forEach(function(a,i){tries.push(a); if(i===0) tries.push(Object.assign({retry:true},a));});
      var errs=[];
      function next(i){
        if(i>=tries.length) return Promise.reject(new Error(errs.join(' | ')));
        var a=tries[i];
        var wait=a.retry?new Promise(function(r){setTimeout(r,1500);}):Promise.resolve();
        if(status) status(a.model+(a.retry?' 재시도':'')+(i?' ('+(i+1)+'/'+tries.length+'번째 시도)':''));
        return wait.then(function(){return (a.provider==='claude'?claude:gemini)(a);}).then(function(j){
          if(errs.length&&j&&!j.error) j.note=(j.note?j.note+' · ':'')+'[대체 사용: '+a.provider+'/'+a.model+' — 앞선 실패: '+errs[0].slice(0,160)+']';
          return j;
        },function(e){
          var m=String(e&&e.message||e); errs.push(m);
          if(window.console) console.warn('[자연어 차트] 실패 → 다음 시도', m);
          var transient=/\b(429|500|502|503|504|529)\b|overload|high demand|UNAVAILABLE|RESOURCE_EXHAUSTED/i.test(m);   // 시간 초과는 재시도 안 함(또 오래 걸림)
          if(tries[i+1]&&tries[i+1].retry&&!transient) return next(i+2);     // 일시 오류가 아니면 같은 모델 재시도는 건너뜀
          return next(i+1);
        });
      }
      return next(0);
    };
  }
  function unlock(pw,remember){
    var msg=document.getElementById('mb-err'); msg.textContent='확인 중…';
    return derive(pw).then(function(k){KEY=k;return get('akey.enc');}).then(dec).then(function(a){
      return crypto.subtle.importKey('raw',b64(a),{name:'AES-GCM'},false,['decrypt']);
    }).then(function(ak){AKEY=ak;return get('content.enc');}).then(dec).then(function(html){
      try{(remember?localStorage:sessionStorage).setItem('mb_pw',pw);}catch(e){}
      document.getElementById('mb-login').remove();
      document.getElementById('mb-main').innerHTML=html;
      return get('cfg.enc').then(dec).then(function(t){var c=JSON.parse(t); if(c.key){ E.chart=chartFn(c); if(c.system_bt) E.backtest=function(q,pack,st){return E.chart(q,pack,st,c.system_bt);};
             if(c.system_sc) E.scenario=function(q,st){return E.chart(q,null,st,c.system_sc);}; }}).catch(function(){})
        .then(function(){window.mbInit();});

  function splitTop(txt){                          // 괄호 밖의 쉼표로만 나눔 (corr60(a, b) 안의 쉼표는 유지)

  // 식 계산: 시계열 id·숫자·사칙연산 + 기간 함수
  //   chgN(x) N기간 전 대비 변화, pctN(x) 변화율(%), lagN(x) N기간 전 값, maN(x) 이동평균, zN(x) 이동 z-score, sumN(x) 이동 합계(누적 순매수 등)

  var FN=/\b(chg|pct|lag|ma|z|sum|corr|lcorr|beta|vol|avol|rvol|std)(\d+)([dwmy]?)\(/i, DAYS={d:1,w:7,m:30.44,y:365.25}, FN2={corr:1,lcorr:1,beta:1};

  function transform(s,fn,n,u,sc){

      var lo;                                        // 창의 시작(lag/chg/pct 의 기준점)
      if(u){ while(j<i&&tt[j+1]<=tt[i]-ms) j++; if(tt[j]>tt[i]-ms) continue; lo=j; }

  function transform2(a,b,fn,n,u){                 // 두 시계열 이동 상관·베타 (같은 날짜끼리 맞춘 뒤)

  function evalExpr(pack,cat,expr,syn){

        var A=evalExpr(pack,cat,args[0].trim(),syn), B=evalExpr(pack,cat,args[1].trim(),syn);
        if(A.freq!==B.freq) throw new Error('일별과 장중(1분) 시계열은 한 함수에 섞을 수 없음');

      if(VOLF[fn]&&fn!=='rvol'&&!FN.test(m[5])&&!/\*\s*100/.test(m[5])){          // 금리(%) 식이면 bp 로
        var b0=(m[5].match(/[A-Za-z_][A-Za-z0-9_]*/g)||[]).filter(function(t){return cat[t];})[0]; if(b0&&cat[b0].unit==='%') sc=100;}
      syn[id]=transform(inner,fn,+m[3],(m[4]||'').toLowerCase(),sc); }
      e=e.slice(0,m[0])+id+e.slice(m[1]);
    }

  /* 고른 시나리오 하나: 행 = 상품, 열 = 만기 — 보유 끝 시점 같은 남은 만기 금리·스프레드 변화(bp) */
  var GRID_T=[[0.25,'3M'],[0.5,'6M'],[1,'1Y'],[2,'2Y'],[3,'3Y'],[5,'5Y'],[10,'10Y'],[20,'20Y'],[30,'30Y']];

  /* 고른 시나리오 하나의 가정 + 성분 분해 + 이유 (선택에 따라 바뀜) */
  function scenExplain(C,mk,key){
    var F=facOf(C), P=C.policy||{}, h=+mk.h_days||91, hy=h/365, sc=Math.sqrt(Math.max(h*250/365,1)/20), nm=C.names||{};

      riskon:'기준금리 경로는 그대로 두고 크레딧 요인이 통상 변동폭만큼 <b>'+n1(-csd)+'bp</b> 좁혀집니다. 섹터·만기별로 요인 베타만큼 좁혀지고, 국고·스왑스프레드도 같은 베타로 반응합니다.',

      custom:'기준금리 '+(dp?'다음 금통위('+mpcDate()+')부터 컨센서스 대비 <b>'+sg(dp,0)+'bp</b>':'경로 그대로')+(auto?' (정책 베타로 금리·스프레드 반응 자동 반영)':'')+

      lines.filter(function(l){return l[1];}).map(function(l){var x=l[1]; return '<tr class="'+l[2]+'"><td class="l">'+l[0]+'</td><td class="'+(x.total>0?'up':(x.total<0?'down':''))+'"><b>'+sg(x.total)+'</b></td>'+

    // 이유: 국고 만기별
    function shockWhy(kind,t,c){

        if(kind==='ss') return '스왑의 정책 베타 '+n1(rowAt(F.swap,t,2),2)+' × '+sg(dp,0)+'bp (IRS 가 국고보다 정책에 더/덜 민감한 만큼)';
        if(kind==='cs'){ var rr=F.credit[c]||[[0.5,1,0,3],[3,1,0,5]]; return '정책 베타 '+n1(rowAt(rr,t,2),2)+' × '+sg(dp,0)+'bp '+(key==='hawk'?'+ 조달 부담 0.5 × 통상폭 '+n1(rowAt(rr,t,3)*sc):'− 완화기 수요 0.25 × 통상폭 '+n1(rowAt(rr,t,3)*sc))+'bp'; } }

  /* 시나리오 설명 (데이터로 채운 줄글) */
  function scenNarr(C,baseMk){

    var steps=cons.filter(function(x,i){return i>0;}).map(function(x){var d=new Date(new Date(C.date+'T00:00:00').getTime()+x[0]*864e5); return (d.getMonth()+1)+'/'+d.getDate()+' '+n1(x[1],2)+'%';});

    var r1=rb(1)||F.rate[0], r3=rb(3), r10=rb(10);

      var now=(cInterp(C.curves[c],t)-cInterp(C.curves[KTB_C],t))*100, m=cInterp(C.mr[c],t); pos.push({nm:(C.names||{})[c]||c,t:t,gap:now-m});});});
    pos.sort(function(a,b){return b.gap-a.gap;});
    var wide=pos.slice(0,3).map(function(x){return x.nm+' '+x.t+'Y '+sgn(x.gap)+'bp';}).join(', '), tight=pos.slice(-3).reverse().map(function(x){return x.nm+' '+x.t+'Y '+sgn(x.gap)+'bp';}).join(', ');
    var ss3=F.swap.filter(function(x){return Math.abs(x[0]-3)<1e-6;})[0], ssNow3=C.curves[IRS_C]?(cInterp(C.curves[IRS_C],3)-cInterp(C.curves[KTB_C],3))*100:null;

      o.push('<h3 class="rt">⑥ 크레딧 보유 상위 60 (수량순)</h3><table><tr><th class="l">종목</th><th>등급</th><th>잔존</th><th>수량</th><th>평가수익률</th><th>매입수익률</th><th>캐리</th><th>롤</th><th>자본차익</th><th>헤지 연환산</th><th>러닝</th><th>민평 대비</th><th>vs 1년평균</th><th>판단</th></tr>'+
        H.map(function(x){var sell=R.sells.indexOf(x)>=0; return '<tr><td class="l">'+esc(x.name)+(x.frn?' <span class="ex">FRN</span>':'')+'</td><td>'+esc(x.rating)+'</td><td>'+tY(x.T)+'</td><td>'+f(x.qty)+'</td><td>'+f(x.yld,3)+'</td><td>'+f(x.buy_yld,3)+
          '</td><td>'+sg(x.o.carry_mn/100,2)+'</td><td>'+sg(x.o.roll_mn/100,2)+'</td><td>'+sg(x.o.scen_mn/100,2)+'</td><td>'+f(x.hann*100,0)+'</td><td>'+f(x.run,0)+'</td><td>'+f(x.issue_bp,1)+'</td><td>'+f(x.mr,1)+'</td><td>'+(sell?'<b>축소</b>':'보유')+'</td></tr>';}).join('')+'</table>');
      o.push('<div class="sub3">계산 방식: 섹터·등급 민평 커브(전 영업일, +오늘 국고 변화)를 잔존만기로 보간한 금리'+(R.notes.some(function(n){return /스프레드는 빼고/.test(n);})?'':' + 명세부 평가수익률과의 차이(종목 스프레드)')+
        '로 보유 '+h+'일 총수익을 계산(총수익 계산기와 같은 식). FRN 은 CD + 가산금리 − 조달 + 스프레드 변화(고정채 + IRS pay 와 같은 합성 FRN 으로 근사), 이자·원금분리채는 무이표로 계산. '+
        '헤지 연환산 = 같은 만기 IRS pay 로 금리 위험을 없앤 크레딧 고유 수익(조달 = 기준금리 경로 + 크레딧 조달 스프레드), 민평 대비 = 명세부 평가수익률 − 섹터 커브(+면 싸게 보유), '+
        'vs 1년평균 = 지금 섹터 스프레드 − 1년 평균(+면 넓음). 편입 한도·개별 크레딧 한도·내부 등급 기준은 반영하지 않았습니다. 참고용 계산입니다.</div>');
      q('#posReport').innerHTML=o.join('');
      // ---- 차트 ----
      var wv=[B.carry,B.roll,B.cap_rate,B.cap_credit];
      Plotly.newPlot('pcWater',[{type:'waterfall',orientation:'v',x:['캐리','롤다운','자본차익·금리','자본차익·크레딧','총손익'],measure:['relative','relative','relative','relative','total'],
        y:wv.concat([B.total]),text:wv.concat([B.total]).map(function(v){return sg(v);}),textposition:'outside',
        increasing:{marker:{color:'#2a78d6'}},decreasing:{marker:{color:'#e34948'}},totals:{marker:{color:'#7a5af8'}},connector:{line:{color:'#888',width:1}}}],
        themeLay({height:280,margin:{l:50,r:10,t:34,b:30},title:{text:'보유 '+h+'일 손익 분해 (억원)',font:{size:13}},showlegend:false}),{displaylogo:false,responsive:true});
      var sk=Object.keys(PL.by_section);
      Plotly.newPlot('pcSec',[['carry','캐리','#2a78d6'],['roll','롤다운','#1baf7a'],['cap_rate','자본차익·금리','#eda100'],['cap_credit','자본차익·크레딧','#e87ba4']].map(function(c){
          return {type:'bar',name:c[1],x:sk,y:sk.map(function(k){return PL.by_section[k][c[0]];}),marker:{color:c[2]}};}),
        themeLay({barmode:'relative',height:280,margin:{l:50,r:10,t:34,b:30},title:{text:'섹터별 손익 분해 (억원)',font:{size:13}},legend:{orientation:'h',y:-0.15}}),{displaylogo:false,responsive:true});
      Plotly.newPlot('pcLadder',[{type:'bar',name:'크레딧',x:S.ladder.map(function(b){return b.bucket;}),y:S.ladder.map(function(b){return b.credit;}),marker:{color:'#2a78d6'}},
        {type:'bar',name:'국고·통안 등',x:S.ladder.map(function(b){return b.bucket;}),y:S.ladder.map(function(b){return b.qty-b.credit;}),marker:{color:'#9aa5b1'}}],
        themeLay({barmode:'stack',height:280,margin:{l:50,r:10,t:30,b:30},title:{text:'만기 사다리 (억원)',font:{size:13}},legend:{orientation:'h',y:1.12}}),{displaylogo:false,responsive:true});
      var it=S.issuers.slice().reverse();
      Plotly.newPlot('pcIss',[{type:'bar',orientation:'h',x:it.map(function(x){return x.qty;}),y:it.map(function(x){return x.issuer;}),text:it.map(function(x){return x.pct.toFixed(1)+'%';}),textposition:'outside',marker:{color:'#1baf7a'}}],
        themeLay({height:280,margin:{l:90,r:40,t:30,b:30},title:{text:'크레딧 발행사 상위 (억원, 크레딧 대비 %)',font:{size:13}},yaxis:{automargin:true}}),{displaylogo:false,responsive:true});
    }
    q('.pf2').addEventListener('change',function(e){
      var file=e.target.files&&e.target.files[0]; if(!file) return;
      FILE=file.name; q('.pmsg').textContent='읽는 중… (큰 파일은 몇 초 걸립니다)'; q('.pdfbtn').disabled=true;
      libs().then(function(){
        return file.arrayBuffer();
      }).then(function(buf){
        var wb=XLSX.read(buf,{type:'array',sheets:['S&T'],dense:true});
        var ws=wb.Sheets['S&T']; if(!ws) throw new Error("'S&T' 시트를 찾지 못했습니다");
        PARSED=window.MBPos.parseSheet(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}));
        if(!PARSED.holdings.length) throw new Error('보유 종목을 읽지 못했습니다 (시트 형식 확인)');
        e.target.value='';                                   // 같은 파일을 다시 골라도 다시 읽게
        run();
      }).catch(function(err){q('.pmsg').textContent='읽기 실패: '+((err&&err.message)||err);});
    });
    box.querySelectorAll('.po').forEach(function(el){el.addEventListener('change',run);});
    q('.pdfbtn').addEventListener('click',function(){
      if(!R) return; var rep=q('#posReport'), btn=q('.pdfbtn'); btn.disabled=true; q('.pmsg').textContent='PDF 만드는 중…';
      var prev=document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme','light'); restyleAll();
      loadScript('vendor/html2pdf.bundle.min.js').then(function(){
        var divs=[].slice.call(rep.querySelectorAll('.js-plotly-plot'));
        return Promise.all(divs.map(function(d){return Plotly.toImage(d,{format:'png',width:d.clientWidth||560,height:280,scale:2});})).then(function(urls){
          var swaps=divs.map(function(d,i){var im=document.createElement('img'); im.src=urls[i]; im.style.width='100%'; d.style.display='none'; d.parentNode.insertBefore(im,d); return [d,im];});
          rep.classList.add('printing'); window.scrollTo(0,0);
          var name='S&T_포지션리포트_'+(R.date||'').replace(/-/g,'')+'_시장'+R.mkt_date.replace(/-/g,'')+'.pdf';
          return html2pdf().set({margin:[8,8,10,8],filename:name,image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,backgroundColor:'#ffffff',useCORS:true,scrollX:0,scrollY:0},
            jsPDF:{unit:'mm',format:'a4',orientation:'landscape'},pagebreak:{mode:['css','legacy'],avoid:['tr','.kpi','.g2','h3']}}).from(rep).save().then(function(){
            swaps.forEach(function(p){p[1].remove(); p[0].style.display='';});
          });
        });
      }).catch(function(e){q('.pmsg').textContent='PDF 실패: '+((e&&e.message)||e);}).then(function(){
        rep.classList.remove('printing'); document.documentElement.setAttribute('data-theme',prev||'dark'); restyleAll(); btn.disabled=false;
        if(/PDF 만드는/.test(q('.pmsg').textContent)) q('.pmsg').textContent='PDF 저장 완료';
      });
    });
    if(location.hash==='#pos'){ var bt=document.querySelector('.seg button[data-f="pos"]'); if(bt) bt.click(); }
  })();

  document.querySelectorAll('details.charts').forEach(function(d){
    d.addEventListener('toggle',function(){
      if(!d.open||d.dataset.loaded) return; d.dataset.loaded='1';
      var key=d.dataset.key, box=d.querySelector('.chart-wrap');
      ensurePlotly().then(function(){
        return new Promise(function(ok,no){pending[key]=ok;mbLoad('entries/'+key+'.js').catch(no);});
      }).then(function(list){render(box,list);}).catch(function(src){box.querySelector('.loading').textContent='차트를 불러오지 못했습니다: '+src;});
    });
  });
  apply();                                          // 첫 화면 = 시장 개요 (링크로 다른 탭·회차를 지정했으면 그 탭)
};
if(!window.MB_ENC) window.mbInit();
</script>
