      var tb=pack.tables||{}, tl=Object.keys(tb).map(function(t){var x=tb[t];
        return [t,x.name,x.unit||'','열: '+x.cols.join('|'),'행: '+x.rows.slice(0,12).map(function(r){return r[0];}).join(', ')].join('\t');}).join('\n');
      var text='시계열 카탈로그 (id\t이름\t단위\tfreq):\n'+lines+'\n\n단면 표 (id\t이름\t단위\t열\t행 예시):\n'+tl+'\n\n요청: '+q.trim().slice(0,300);
      function parse(t){var m=(t||'').match(/\{[\s\S]*\}/); if(!m) return {error:'해석 실패'};
        return JSON.parse(m[0]);}                      // 검증은 대시보드 normSpec (서버 모드와 공통)
      // 시간 제한 있는 POST (과부하 때 한참 붙잡고 있다가 503 을 주는 경우 대비). 기본 90초 = publish.llm_timeout_sec
      //  (Gemini 3.x 는 생각을 최소(low)로 해도 카탈로그 ~700개 해석에 25초를 넘기는 경우가 있음)
      var TMO=(cfg.timeout_sec||90)*1000;
      function post(url,headers,body){
        var ac=window.AbortController?new AbortController():null, to=setTimeout(function(){if(ac)ac.abort();},TMO);
        return fetch(url,{method:'POST',headers:headers,body:JSON.stringify(body),signal:ac?ac.signal:undefined})
          .then(function(r){return r.json().catch(function(){return {error:{code:r.status,message:'HTTP '+r.status}};});})
          .catch(function(e){return {error:{code:'timeout',message:(e&&e.name==='AbortError')?'응답 지연('+Math.round(TMO/1000)+'초)':String(e&&e.message||e)}};})
          .then(function(j){clearTimeout(to);return j;});
      }
      function claude(a){
        var cb={model:a.model,max_tokens:16000,system:cfg.system,messages:[{role:'user',content:text}],output_config:{effort:'low'}};
        var h={'content-type':'application/json','x-api-key':a.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
        var U='https://api.anthropic.com/v1/messages';
        return post(U,h,cb).then(function(r){
          if(r.error&&/effort|output_config/i.test(r.error.message||'')){delete cb.output_config;return post(U,h,cb);}   // 구형 모델
          return r;
        }).then(function(r){
          if(r.error) throw new Error('Claude '+(r.error.type||r.error.code||'')+' '+(r.error.message||''));
          return parse((r.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text||'';}).join(''));
        });
      }
      function gemini(a){
        // 차트 스펙은 추론 없이 바로 출력.
        //  2.5: thinkingBudget 0 / 3.x 이후: thinkingLevel minimal → (거부 시) low → 설정 없음
        //  3.x 이후는 temperature·top_p·top_k 를 보내지 않음 (3.8 등은 폐지 — 보내면 400 이거나 루프·품질 저하)
        //  400 메시지에 따라 문제 파라미터만 빼고 다시 보냄. 통한 설정은 모델별로 기억 (같은 세션 재요청 시 바로)
        var v25=/2\.5/.test(a.model);
        var gc=GEM_OK[a.model]?JSON.parse(GEM_OK[a.model]):(v25?
          {temperature:0.2,maxOutputTokens:8192,responseMimeType:'application/json',thinkingConfig:{thinkingBudget:0}}:
          {maxOutputTokens:8192,responseMimeType:'application/json',thinkingConfig:{thinkingLevel:'minimal'}});
        var body={systemInstruction:{parts:[{text:cfg.system}]},contents:[{role:'user',parts:[{text:text}]}],generationConfig:gc};
        var U='https://generativelanguage.googleapis.com/v1beta/models/'+a.model+':generateContent', H={'Content-Type':'application/json','x-goog-api-key':a.key};
        function fix(r){                                   // 400 → 고칠 수 있는 파라미터면 고치고 true
          if(!(r.error&&(r.error.code===400||r.error.status==='INVALID_ARGUMENT'))) return false;
          var m=String(r.error.message||''), ch=false;
          if(/thinking/i.test(m)&&gc.thinkingConfig){
            if(gc.thinkingConfig.thinkingLevel==='minimal') gc.thinkingConfig={thinkingLevel:'low'};
            else delete gc.thinkingConfig;
            ch=true;}
          if(/temperature|top_?p|top_?k|sampling/i.test(m)){['temperature','topP','topK'].forEach(function(k){if(k in gc){delete gc[k];ch=true;}});}
          if(/response_?mime|mime_?type|json/i.test(m)&&gc.responseMimeType){delete gc.responseMimeType;ch=true;}
          if(ch&&window.console) console.warn('[자연어 차트] Gemini 400 → 설정 조정 후 재요청:',m,JSON.stringify(gc));
          return ch;
        }
        function go(n){return post(U,H,body).then(function(r){return (n<4&&fix(r))?go(n+1):r;});}
        return go(0).then(function(r){
          if(r.error) throw new Error('Gemini('+a.model+') '+(r.error.code||'')+' '+(r.error.status||'')+' '+(r.error.message||''));
          var c0=(r.candidates||[])[0]||{};
          if(window.console) console.log('[자연어 차트]',a.model,c0.finishReason,JSON.stringify(gc),r.usageMetadata);
          var tx=((c0.content||{}).parts||[]).filter(function(p){return !p.thought;}).map(function(p){return p.text||'';}).join('');
          if(!tx.trim()) throw new Error('Gemini('+a.model+') 빈 응답 ('+(c0.finishReason||(r.promptFeedback||{}).blockReason||'?')+')');
          GEM_OK[a.model]=JSON.stringify(gc);
          return parse(tx);
        });
      }
      // 시도 순서: 기본 모델 → (과부하·한도·지연이면) 같은 모델 1회 재시도 → 대체 모델 → 다른 공급자
      var chain=(cfg.chain&&cfg.chain.length)?cfg.chain:[{provider:cfg.provider,key:cfg.key,model:cfg.model}];
      var tries=[]; chain.forEach(function(a,i){tries.push(a); if(i===0) tries.push(Object.assign({retry:true},a));});
      var errs=[];
      function next(i){
        if(i>=tries.length) return Promise.reject(new Error(errs.join(' | ')));
        var a=tries[i];
        var wait=a.retry?new Promise(function(r){setTimeout(r,1500);}):Promise.resolve();
        if(status) status(a.model+(a.retry?' 재시도':'')+(i?' ('+(i+1)+'/'+tries.length+'번째 시도)':''));
        return wait.then(function(){return (a.provider==='claude'?claude:gemini)(a);}).then(function(j){
          if(errs.length&&j&&!j.error) j.note=(j.note?j.note+' · ':'')+'[대체 사용: '+a.provider+'/'+a.model+' — 앞선 실패: '+errs[0].slice(0,160)+']';
          return j;
        },function(e){
          var m=String(e&&e.message||e); errs.push(m);
          if(window.console) console.warn('[자연어 차트] 실패 → 다음 시도', m);
          var transient=/\b(429|500|502|503|504|529)\b|overload|high demand|UNAVAILABLE|RESOURCE_EXHAUSTED/i.test(m);   // 시간 초과는 재시도 안 함(또 오래 걸림)
          if(tries[i+1]&&tries[i+1].retry&&!transient) return next(i+2);     // 일시 오류가 아니면 같은 모델 재시도는 건너뜀
          return next(i+1);
        });
      }
      return next(0);
    };
  }
  function unlock(pw,remember){
    var msg=document.getElementById('mb-err'); msg.textContent='확인 중…';
    return derive(pw).then(function(k){KEY=k;return get('content.enc');}).then(dec).then(function(html){
      try{(remember?localStorage:sessionStorage).setItem('mb_pw',pw);}catch(e){}
      document.getElementById('mb-login').remove();
      document.getElementById('mb-main').innerHTML=html;
      return get('cfg.enc').then(dec).then(function(t){var c=JSON.parse(t); if(c.key) E.chart=chartFn(c);}).catch(function(){})
        .then(function(){window.mbInit();});
    }).catch(function(e){KEY=null;msg.textContent=(e&&e.name==='OperationError')?'비밀번호가 맞지 않습니다.':('열기 실패: '+((e&&e.message)||e));throw e;});
  }
  document.addEventListener('DOMContentLoaded',function(){
    if(!window.crypto||!crypto.subtle){document.getElementById('mb-err').textContent='이 브라우저는 암호 해제를 지원하지 않습니다 (https 주소로 여세요).';return;}
    var f=document.getElementById('mb-form');
    f.addEventListener('submit',function(ev){ev.preventDefault();
      var r=norm(document.getElementById('mb-rate').value); if(!r){document.getElementById('mb-err').textContent='숫자로 입력하세요 (예 4.415)';return;}
      var pinEl=document.getElementById('mb-pin'), pw=r+(C.pin?'|'+(pinEl?pinEl.value.trim():''):'');
      unlock(pw,document.getElementById('mb-remember').checked).catch(function(){});
    });
    var saved=null; try{saved=sessionStorage.getItem('mb_pw')||localStorage.getItem('mb_pw');}catch(e){}
    if(saved) unlock(saved,false).catch(function(){document.getElementById('mb-err').textContent='';});
  });
})();

<script>

  // ---------- 테마 (차트 색도 함께) ----------
  var THEMES={dark:{bg:'#171a20',ink:'#e8eaee',ink2:'#b3b9c4',grid:'#2a2f38',zero:'#4a5160',hover:'#232830'},
              light:{bg:'#ffffff',ink:'#15181d',ink2:'#4a5261',grid:'#e9ecef',zero:'#cfcec9',hover:'#ffffff'}};
  var LIGHT_INK=['#0b0b0b','#52514e','#8a8984','#15181d','#4a5261','#111','#111111','#666','#888','#999'];
  function curTheme(){return document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';}
  function themeLay(lay){
    var T=THEMES[curTheme()]; lay=lay||{};
    lay.paper_bgcolor=T.bg; lay.plot_bgcolor=T.bg;
    lay.font=Object.assign({},lay.font||{},{color:T.ink});
    if(lay.title&&typeof lay.title==='object') lay.title.font=Object.assign({},lay.title.font||{},{color:T.ink});
    lay.legend=Object.assign({},lay.legend||{},{font:Object.assign({},(lay.legend||{}).font||{},{color:T.ink2}),bgcolor:'rgba(0,0,0,0)'});
    lay.hoverlabel=Object.assign({},lay.hoverlabel||{},{bgcolor:T.hover,font:Object.assign({},(lay.hoverlabel||{}).font||{},{color:T.ink})});
    Object.keys(lay).forEach(function(k){ if(/^[xy]axis\d*$/.test(k)){ var a=lay[k]=Object.assign({},lay[k]);
      a.gridcolor=T.grid; a.linecolor=T.grid; a.tickcolor=T.grid; a.zerolinecolor=T.zero;
      a.tickfont=Object.assign({},a.tickfont||{},{color:T.ink2});
      if(a.title&&typeof a.title==='object') a.title.font=Object.assign({},a.title.font||{},{color:T.ink2}); }});
    ['xaxis','yaxis'].forEach(function(k){ if(!lay[k]) lay[k]={gridcolor:T.grid,linecolor:T.grid,zerolinecolor:T.zero,tickfont:{color:T.ink2}}; });
    (lay.annotations||[]).forEach(function(an){ var c=(an.font||{}).color;
      if(!c||LIGHT_INK.indexOf(String(c).toLowerCase())>=0||c===THEMES.dark.ink||c===THEMES.light.ink||c===THEMES.dark.ink2||c===THEMES.light.ink2)
        an.font=Object.assign({},an.font||{},{color:T.ink2});
      if(an.bgcolor&&/255,\s*255,\s*255/.test(an.bgcolor)) an.bgcolor=curTheme()==='dark'?'rgba(23,26,32,0.85)':an.bgcolor; });
    return lay;
  }
  function themeData(data){                      // 표(Table) 트레이스: 머리·칸 배경과 글자색
    var T=THEMES[curTheme()], dk=curTheme()==='dark';

      if(t.type==='table'){
        t.header=Object.assign({},t.header||{}); t.cells=Object.assign({},t.cells||{});
        t.header.fill={color:dk?'#232a36':'#eef3fa'}; t.cells.fill={color:dk?'#171a20':'#ffffff'};
        t.header.font=Object.assign({},t.header.font||{},{color:T.ink}); t.cells.font=Object.assign({},t.cells.font||{},{color:T.ink});
        t.header.line={color:T.grid}; t.cells.line={color:T.grid};
      } else if(t.type==='heatmap'&&t.texttemplate){ t.textfont=Object.assign({},t.textfont||{},{color:dk?'#e8eaee':'#15181d'}); }
    });

  function restyleAll(){

  }
  var tb=document.getElementById('themebtn');
  function setBtn(){ tb.textContent=curTheme()==='dark'?'☀️ 라이트':'🌙 다크'; }
  if(tb){ setBtn(); tb.addEventListener('click',function(){
    var t=curTheme()==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',t);
    try{localStorage.setItem('mb_theme',t);}catch(e){} setBtn(); restyleAll(); }); }

  // 차트: 펼칠 때 plotly 와 해당 회차 데이터를 <script> 로 불러옴 (file:// 에서도 동작)
  var plotlyReady=null, pending={};
  function loadScript(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){no(src)};document.head.appendChild(s);});}
  function mbLoad(src){return window.MB_ENC?window.MB_ENC.load(src):loadScript(src);}   // 배포본: 암호화된 파일을 풀어서 실행
  function ensurePlotly(){return plotlyReady||(plotlyReady=window.Plotly?Promise.resolve():loadScript('vendor/plotly.min.js'));}
  window.__mbCharts=function(key,list){var p=pending[key];delete pending[key];if(p)p(list);};
  function render(box,list){
    var byId={}; list.forEach(function(c){byId[c.id]=c.fig;});
    box.querySelectorAll('.chart').forEach(function(div){
      var f=byId[div.dataset.id]; if(!f){div.style.display='none';return;}
      var lay=Object.assign({},f.layout||{}); delete lay.width; lay.height=Math.min(lay.height||460,460); lay.autosize=true;

    });
    var l=box.querySelector('.loading'); if(l) l.remove();
  }
  // ---------- 차트 빌더: 시계열 묶음(entries/<key>-data.js) + 식 계산 ----------
  var DATA={}, dataWait={}, dataP={};
  window.__mbData=function(key,pack){DATA[key]=pack; var w=dataWait[key]; delete dataWait[key]; if(w) w(pack);};
  // 장기 이력(entries/long_hist.js): 회차 묶음(약 1년)의 앞쪽에 이어 붙여 '전체·5년·10년' 차트가 길게 그려지도록
  var LONG=null, longP=null, longWait=null;
  window.__mbLong=function(pack){LONG=pack; if(longWait) longWait(pack);};
  function loadLong(){
    if(LONG) return Promise.resolve(LONG);
    if(!longP) longP=new Promise(function(ok){longWait=ok; mbLoad('entries/long_hist.js').catch(function(){ok(null);});});
    return longP;
  }
  function mergeLong(pack,L){
    if(!L||pack.__long) return pack; pack.__long=true;
    var have={}; pack.catalog.forEach(function(c){have[c.id]=c;});
    Object.keys(L.data||{}).forEach(function(id){
      var old=L.data[id]; if(!old||!old.length) return;
      if(have[id]){ if(have[id].freq!=='D') return;
        var cur=pack.data[id]||[], first=cur.length?cur[0][0]:'9999';
        var pre=old.filter(function(p){return p[0]<first;}); if(pre.length) pack.data[id]=pre.concat(cur);
      } else { var c=(L.catalog||[]).find(function(x){return x.id===id;});
        if(c){ pack.catalog.push(Object.assign({},c,{name:c.name+' (장기)'})); pack.data[id]=old; } }
    });
    return pack;
  }
  function loadData(key){
    if(DATA[key]&&DATA[key].__long) return Promise.resolve(DATA[key]);
    if(!dataP[key]) dataP[key]=new Promise(function(ok,no){dataWait[key]=ok;
      mbLoad('entries/'+key+'-data.js').catch(function(e){delete dataP[key];no(e);});})
      .then(function(pack){return loadLong().then(function(L){return mergeLong(pack,L);});});
    return dataP[key];
  }
  function splitTop(txt){                          // 괄호 밖의 쉼표로만 나눔 (corr60(a, b) 안의 쉼표는 유지)
    var out=[],d=0,cur='';
    for(var i=0;i<txt.length;i++){var c=txt[i]; if(c==='(') d++; else if(c===')') d--;
      if(c===','&&d===0){out.push(cur);cur='';} else cur+=c;}
    out.push(cur); return out;
  }
  function parseExprs(txt){
    return splitTop(txt).map(function(x){return x.trim();}).filter(Boolean).map(function(x){
      var i=x.indexOf('='); return i>0?{label:x.slice(0,i).trim(),expr:x.slice(i+1).trim()}:{label:x,expr:x};});
  }
  // 식 계산: 시계열 id·숫자·사칙연산 + 기간 함수
  //   chgN(x) N기간 전 대비 변화, pctN(x) 변화율(%), lagN(x) N기간 전 값, maN(x) 이동평균, zN(x) 이동 z-score, sumN(x) 이동 합계(누적 순매수 등)
  //   N 뒤에 D/W/M/Y 를 붙이면 달력 기준(1Y = 1년 전 같은 날 또는 그 직전), 숫자만이면 관측치 개수(일별 = 거래일, 장중 = 분)
  //   예) chg1Y(KTB_3Y)*100 → 국고 3년 전년 동기 대비 변화(bp), ma20((KTB_10Y-KTB_3Y)*100) → 3-10 20일 이동평균
  //   두 시계열 함수: corrN(a, b) 이동 상관(1기간 변화끼리), lcorrN(a, b) 수준끼리 상관, betaN(a, b) a 변화의 b 변화에 대한 베타
  //   예) corr60(KOSPI_D, -1*KTB_10Y) → 주식·채권(가격) 60일 상관
  //   변동성: volN(x) 1기간 변화의 N 이동 표준편차(금리는 bp), avolN(x) 연율화(×√252), rvolN(x) 수익률(로그) 연율 변동성 %, stdN(x) 수준의 이동 표준편차
  var FN=/\b(chg|pct|lag|ma|z|sum|corr|lcorr|beta|vol|avol|rvol|std)(\d+)([dwmy]?)\(/i, DAYS={d:1,w:7,m:30.44,y:365.25}, FN2={corr:1,lcorr:1,beta:1};
  var FNTOK=/^(chg|pct|lag|ma|z|sum|corr|lcorr|beta|vol|avol|rvol|std)\d+[dwmy]?$/i, VOLF={vol:1,avol:1,rvol:1,std:1};
  function findFn(e){                                  // 첫 기간 함수와 짝 맞는 닫는 괄호까지 → [시작, 끝, 이름, N, 단위, 안쪽 식]

          var name='S&T_포지션리포트_'+(R.date||'').replace(/-/g,'')+'_시장'+R.mkt_date.replace(/-/g,'')+'.pdf';
          return html2pdf().set({margin:[8,8,10,8],filename:name,image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,backgroundColor:'#ffffff',useCORS:true,scrollX:0,scrollY:0},
            jsPDF:{unit:'mm',format:'a4',orientation:'landscape'},pagebreak:{mode:['css','legacy'],avoid:['tr','.kpi','.g2','h3']}}).from(rep).save().then(function(){
            swaps.forEach(function(p){p[1].remove(); p[0].style.display='';});
          });
        });
      }).catch(function(e){q('.pmsg').textContent='PDF 실패: '+((e&&e.message)||e);}).then(function(){
        rep.classList.remove('printing'); document.documentElement.setAttribute('data-theme',prev||'dark'); restyleAll(); btn.disabled=false;
        if(/PDF 만드는/.test(q('.pmsg').textContent)) q('.pmsg').textContent='PDF 저장 완료';
      });
    });
    if(location.hash==='#pos'){ var bt=document.querySelector('.seg button[data-f="pos"]'); if(bt) bt.click(); }
  })();

  document.querySelectorAll('details.charts').forEach(function(d){
    d.addEventListener('toggle',function(){
      if(!d.open||d.dataset.loaded) return; d.dataset.loaded='1';
      var key=d.dataset.key, box=d.querySelector('.chart-wrap');
      ensurePlotly().then(function(){
        return new Promise(function(ok,no){pending[key]=ok;mbLoad('entries/'+key+'.js').catch(no);});
      }).then(function(list){render(box,list);}).catch(function(src){box.querySelector('.loading').textContent='차트를 불러오지 못했습니다: '+src;});
    });
  });
};
if(!window.MB_ENC) window.mbInit();
</script>
</body>
</html>
